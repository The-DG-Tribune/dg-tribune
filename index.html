<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DG Tribune | Football News, Players, Quizzes, Wallpapers & Tools</title>
    <meta name="description" content="DG Tribune is your home for football: daily news, player and team profiles, quizzes, trivia, HD wallpapers, a dream team builder and more." />
    <meta name="keywords" content="DG Tribune, football news, football players, football quizzes, football wallpapers, dream team builder, football trivia" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="DG Tribune" />
    <link rel="canonical" href="https://dg-tribune.vercel.app/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DG Tribune" />
    <meta property="og:title" content="DG Tribune | Football News, Players, Quizzes, Wallpapers & Tools" />
    <meta property="og:description" content="Football news, players, teams, leagues, quizzes, wallpapers and interactive tools in one modern platform." />
    <meta property="og:image" content="https://dg-tribune.vercel.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://dg-tribune.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DG Tribune | Football News, Players, Quizzes, Wallpapers & Tools" />
    <meta name="twitter:description" content="Football news, players, teams, leagues, quizzes, wallpapers and interactive tools in one modern platform." />
    <meta name="twitter:image" content="https://dg-tribune.vercel.app/og-cover.png" />

    <!-- Preconnect for font performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#0B0F19" />

    <!-- Brand icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: tells Google who DG Tribune is and that the site has search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://dg-tribune.vercel.app/#org",
            "name": "DG Tribune",
            "alternateName": ["DGTribune", "The DG Tribune"],
            "url": "https://dg-tribune.vercel.app/",
            "logo": "https://dg-tribune.vercel.app/icon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://dg-tribune.vercel.app/#website",
            "url": "https://dg-tribune.vercel.app/",
            "name": "DG Tribune",
            "alternateName": "DGTribune",
            "publisher": { "@id": "https://dg-tribune.vercel.app/#org" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://dg-tribune.vercel.app/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>DG Tribune: football news, players, quizzes, wallpapers and tools. Please turn on JavaScript to use the site.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
